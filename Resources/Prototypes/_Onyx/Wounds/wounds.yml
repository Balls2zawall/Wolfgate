# WOLFGATE (WP7): Ipc/Slime/Plant/Cybernetic profiles and their wounds are dropped for phase 1 (D3).
- type: bodyPartProfile
  id: OrganicBodyPartProfile
  treatmentCapabilities: [Biological]
  bleedingMultiplier: 1.0
  acceptedDamageTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Cold
    - Shock
    - Caustic # WOLFGATE: D20 reversed - OrganicPart supports the whole Burn group, which includes Caustic
  supportedWounds:
    - BluntWound
    - SlashWound
    - PiercingWound
    - BurnWound
    - ElectricalWound
    - BoneFractureWound
    - SurgicalIncisionWound
    - DismembermentWound
    - AmputationConsequenceWound
    - InternalBleedingWound
    - MedicalScarWound
    - SystemicBleedingWound
  organDamage:
    chances:
      Head: 0.05
      # WOLFGATE (D9): Onyx's Chest 0.04 and Groin 0.04 fold into Torso 0.04 (not summed - independent per-part rolls, one torso).
      Torso: 0.04
      Arm: 0.02
      Hand: 0.01
      Leg: 0.02
      Foot: 0.01
    maxAffected: 2

- type: fractureProfile
  id: OrganicFractureProfile
  damageType: Blunt
  wound: BoneFractureWound
  severityMultiplier: 1
  resetTreatmentOnDamage: true
  worsenMinimumDamage: 5
  minimumHitDamage: 3
  accumulationMultiplier: 0.4
  reductionMinimumGrade: Simple
  removeWoundWhenMended: true
  alert: BrokenBones
  alertMinimumGrade: Simple
  alertHiddenTreatments: [Mended]
  treatmentEffectScales:
    None: 1
    Reduced: 0.25
    Mended: 0
  grades:
    Hairline:
      threshold: 20
      creationChance: 0.05
      movementModifier: 0.625
      manipulationModifier: 0.92
    Simple:
      threshold: 35
      creationChance: 0.25
      movementModifier: 0.5
      manipulationModifier: 0.84
    Displaced:
      threshold: 50
      creationChance: 0.65
      movementModifier: 0
      manipulationModifier: 0.75
    Comminuted:
      threshold: 60
      creationChance: 1
      movementModifier: 0
      manipulationModifier: 0.75

- type: wound
  id: BluntWound
  name: wound-name-blunt
  damageTypes:
    Blunt:
      reopenMinimumDamage: 18
      severityMultiplier: 1
  maximumSeverity: 200
  behaviors:
  - !type:WoundPainBehavior
    painPerSeverity: 0.87
    minSeverity: 10
  - !type:WoundScarBehavior
    threshold: 20
    chance: 1
  stages:
    Minor:
      name: wound-stage-minor
      severity: 0
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.05
        chance: 0.25
        minimumSeverity: 8
    Moderate:
      name: wound-stage-moderate
      severity: 25
      behaviors:
      - !type:WoundBleedingBehavior
        rate: 0.08
        chance: 0.35
        minimumSeverity: 8
    Severe:
      name: wound-stage-severe
      severity: 50
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Impaired
      - !type:WoundBleedingBehavior
        rate: 0.12
        chance: 0.5
        minimumSeverity: 8
    Critical:
      name: wound-stage-critical
      severity: 80
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundBleedingBehavior
        rate: 0.18
        chance: 0.7
        minimumSeverity: 8

- type: wound
  id: BoneFractureWound
  name: wound-name-bone-fracture
  damageTypes: {}
  maximumSeverity: 200
