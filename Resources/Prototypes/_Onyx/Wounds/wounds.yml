        minSeverity: 15
        oneTime: true
    Displaced:
      name: wound-stage-fracture-displaced
      examineDescription: wound-examine-fracture-displaced
      severity: 50
      behaviors:
      - !type:WoundFunctionalityBehavior
        state: Disabled
      - !type:WoundPainBehavior
        painPerSeverity: 0.65
        minSeverity: 15
        oneTime: true
    Comminuted:
      name: wound-stage-fracture-comminuted
      examineDescription: wound-examine-fracture-comminuted
      severity: 60
      behaviors:
      - !type:WoundFunctionalityBehavior
