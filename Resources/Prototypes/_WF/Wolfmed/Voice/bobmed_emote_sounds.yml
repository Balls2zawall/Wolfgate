# The voices of the Wolfmed emotes, by sex. WolfmedBodySoundSystem plays from these when a body's own species set
# has nothing for the emote, so every humanoid species gets them without an edit to its upstream set, and a
# species that maps one of these emotes itself keeps its own sound. Everything listed here is flesh only.
# Unsexed bodies use the male set, as VocalSystem does for humans.

- type: emoteSounds
  id: WFWolfmedMaleEmotes
  params:
    variation: 0.125
  sounds:
    WFWolfmedSneeze:
      collection: WFWolfmedSneezeMale
    WFWolfmedSnore:
      collection: WFWolfmedSnore
    WFWolfmedSniff:
      collection: WFWolfmedSniffMale
    WFWolfmedGulp:
      collection: WFWolfmedGulp

- type: emoteSounds
  id: WFWolfmedFemaleEmotes
  params:
    variation: 0.125
  sounds:
    WFWolfmedSneeze:
      collection: WFWolfmedSneezeFemale
    WFWolfmedSnore:
      collection: WFWolfmedSnore
    WFWolfmedSniff:
      collection: WFWolfmedSniffFemale
    WFWolfmedGulp:
      collection: WFWolfmedGulp
