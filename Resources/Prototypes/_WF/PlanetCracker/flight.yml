# Atmospheric flight (F10): the only lift a hull has over a planet, and the kit that converts an ordinary thruster.

- type: entity
  id: WFThrusterLanding
  parent: Thruster
  name: landing thruster
  suffix: Landing
  description: A thruster canted to fire straight down as well as back. Rated to hold its own share of a hull against one gee, which is the only thing keeping anything in the air over a planet.
  components:
  # Planet layers have air in them, and the stock thruster refuses to fire outside vacuum.
  - type: Thruster
    requireSpace: false
  - type: WFLandingThruster
    liftThrust: 50

- type: entity
  id: WFLandingThrusterKit
  parent: BaseItem
  name: landing thruster conversion kit
  description: A gimbal collar, a downward bell and an afternoon of work, in a box. Use it on an anchored thruster.
  components:
  # Existing art: the blue toolbox, which is what a conversion kit in a box looks like.
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_blue.rsi
    state: icon
  - type: Item
  - type: WFLandingThrusterKit
    variant: WFThrusterLanding
  - type: StaticPrice
    price: 400
