- type: entity
  id: WFCarcinomaHullTendril
  name: anchoring flesh tendril
  description: A thick tendril grips the hull and roots it to Carcinoma. Cut or attack every tendril to free the ship.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Mobs/Aliens/Asteroid/goliath.rsi
    state: goliath_tentacle_wiggle
    color: "#b56576"
    scale: 2, 2
    drawdepth: OverMobs
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        layer: [Impassable]
        mask: [Impassable]
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: WFCarcinomaTendril
