# Rim decals and extraction-moment effect entities for the cut disc (F5). No tile prototype:
# the hole is Tile.Empty and the rim decals sit on ordinary pinned biome ground.

- type: decal
  id: WFCrackRimStraight
  tags: [ "wfcrack" ]
  snapCardinals: false # the ring is rotated per decal via the Angle argument
  defaultSnap: false
  sprite: { sprite: _WF/PlanetCracker/Decals/crack_rim.rsi, state: rim-straight }

- type: decal
  id: WFCrackRimCurve
  tags: [ "wfcrack" ]
  snapCardinals: false
  defaultSnap: false
  sprite: { sprite: _WF/PlanetCracker/Decals/crack_rim.rsi, state: rim-curve }

- type: entity
  id: WFEffectChunkBurst
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.56 # 8 frames x 0.07 s, from chunk_burst.rsi/meta.json
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      sprite: _WF/PlanetCracker/Effects/chunk_burst.rsi
      state: burst
  - type: Tag
    tags: [ HideContextMenu ]

- type: entity
  id: WFCrackSkyBeam
  categories: [ HideSpawnMenu ]
  components:
  # Existing art: the same ship-laser beam frame the cutting beam overlay draws (_Mono lasers.rsi `grayscale_beam`),
  # which is a full-width horizontal line authored greyscale so it can be tinted. A sprite layer is scaled before it
  # is rotated (Matrix3Helpers.CreateTransform), so `scale: 5, 1` stretches the line to five tiles along its own X and
  # `rotation: 90` then stands it up as the 1x5 pillar the beam wants.
  - type: Sprite
    drawdepth: Effects
    noRot: true # stays world-up on a rotated grid
    offset: "0,2.0" # the pillar is 1x5 tiles centred on the entity; set in YAML, never at runtime
    layers:
    - shader: unshaded
      sprite: _Mono/Objects/Weapons/Guns/Projectiles/lasers.rsi
      state: grayscale_beam
      scale: 5, 1
      rotation: 90
  - type: Physics
    canCollide: false
  - type: Tag
    tags: [ HideContextMenu ]
