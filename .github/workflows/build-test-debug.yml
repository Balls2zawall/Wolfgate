name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, staging, stable ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /p:WarningsAsErrors=nullable /m

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    # Wolfgate: bash with a resource sampler and per-test results. This step keeps getting cancelled with
    # nothing in the log, and a cancel skips the upload below, so the step log is the only evidence left.
    - name: Run Content.IntegrationTests
      shell: bash
      run: |
        (
          seen=0
          while sleep 20; do
            echo "[res] $(date -u +%T) $(free -m | awk '/^Mem:/{printf "used=%sM avail=%sM", $3, $7} /^Swap:/{printf " swap=%sM", $3}') load=$(cut -d' ' -f1-3 /proc/loadavg) disk=$(df -h --output=avail / | tail -1 | tr -d ' ') top=$(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<=4{printf "%s:%dM ", $2, $1/1024}')"
            oom=$(sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process" || true)
            count=$(printf '%s' "$oom" | grep -c . || true)
            if [ "$count" -gt "$seen" ]; then
              printf '%s\n' "$oom" | tail -n $((count - seen)) | sed 's/^/[oom] /'
              seen=$count
            fi
          done
        ) &
        trap 'kill $! 2>/dev/null || true' EXIT
        export DOTNET_gcServer=1
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "FullyQualifiedName!~ShipyardTest" --logger "console;verbosity=normal" -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.os }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
